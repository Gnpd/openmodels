name: OpenModels CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo 'matrix=["3.10","3.11","3.12","3.13"]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=["3.11"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJson(needs.setup.outputs.matrix) }}
    env:
      # Pin BLAS/LAPACK to a single thread so numerical routines (e.g. ARPACK eigensolvers
      # used by SpectralEmbedding) are bit-reproducible across runs. Without this,
      # multi-threaded OpenBLAS can nondeterministically reorder floating-point reductions,
      # which for near-degenerate eigenvalues can flip which eigenvector converges into which
      # slot - causing rare, environment-dependent CI flakes unrelated to serialization.
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry/virtualenvs
            ~/.cache/pip
          key: ${{ runner.os }}-poetry-${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Print versions
        run: |
          echo "Python version:"
          python --version
          echo "Black version:"
          poetry run black --version

      - name: Run tests
        run: poetry run pytest

      - name: Run type checking
        run: poetry run mypy openmodels

      - name: Check formatting
        run: poetry run black --check openmodels

      - name: Run linting
        run: poetry run flake8 openmodels

      - name: Check for leftover debug print statements
        run: |
          if grep -r "print(" openmodels; then
            echo "Warning: Found print statements in the code. Please remove them before merging."
            exit 1
          fi

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry/virtualenvs
            ~/.cache/pip
          key: ${{ runner.os }}-poetry-3.11-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-3.11-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Build package
        run: poetry build

      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
