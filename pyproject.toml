[project]
name = "openmodels"
version = "0.2.0"
description = "Export scikit-learn model files to JSON for sharing or deploying predictive models with peace of mind."
authors = [
    { name = "Alejandro Gutierrez", email = "a.gutierrez@g-npd.com" },
    { name = "Pau Cabaneros", email = "pau.cabaneros@gmail.com" },
    { name = "Raúl Marín", email = "hi@raulmarin.dev" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<4.0"
keywords = ["scikit-learn", "serialization", "machine-learning", "json", "model-export", "mlops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["dependencies"]

[project.optional-dependencies]
msgpack = ["msgpack (>=1.0,<2.0)"]
yaml = ["PyYAML (>=6.0,<7.0)"]

[project.urls]
Homepage = "https://gnpd.github.io/openmodels/"
Repository = "https://github.com/Gnpd/openmodels"
Documentation = "https://gnpd.github.io/openmodels/"
Changelog = "https://github.com/Gnpd/openmodels/blob/main/CHANGELOG.md"
Issues = "https://github.com/Gnpd/openmodels/issues"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
scikit-learn = "^1.6.0"
msgpack = {version = "^1.0", optional = true}
PyYAML = {version = "^6.0", optional = true}

[tool.poetry.group.dev.dependencies]
poetry-types = "^0.6.2"
mypy = "^1.10.0"
pytest = "^9.0.3"
pre-commit = "^3.7.1"
black = "^26.3.1"
flake8 = "^7.1.1"
pytest-cov = "^7.0.0"
msgpack = "^1.0"
PyYAML = "^6.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "^8.0"
pydata-sphinx-theme = ">=0.15"
myst-parser = "^4.0"
numpydoc = "^1.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["msgpack", "yaml"]
ignore_missing_imports = true
